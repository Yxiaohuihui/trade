[project]
name = "stockpilot"
version = "0.1.0"
description = "A 股持仓监控 + 机会雷达：本地运行，输出每日 markdown 投资日报"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.12.0",
    "baostock>=0.8.9",
    "duckdb>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
